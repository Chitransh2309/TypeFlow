services:
  - type: web
    name: typeflow-socket-server
    runtime: node
    plan: free
    rootDir: socket-server
    buildCommand: npm install --prefix .. --legacy-peer-deps && npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
